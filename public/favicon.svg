<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2342" />
      <stop offset="100%" stop-color="#040A14" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00D4FF" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark navy badge with rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#1E3A66" stroke-width="1.2" opacity="0.6" />

  <!-- Cyan Checkmark (Vapor Trail) with glow -->
  <path
    d="M 12 38 L 22 48 C 23.2 49.2 25.2 49.2 26.4 48 L 38 33"
    fill="none"
    stroke="url(#checkGrad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#cyanGlow)"
  />

  <!-- Clean White Airplane -->
  <!-- Fuselage and Wings banking up-right at 45 deg -->
  <g transform="translate(36, 26) rotate(45)">
    <!-- Main fuselage -->
    <path
      d="M 0 -18 C 1.8 -18 3 -12 3 -4 L 3 8 C 3 10 1.8 11 0 11 C -1.8 11 -3 10 -3 8 L -3 -4 C -3 -12 -1.8 -18 0 -18 Z"
      fill="#FFFFFF"
    />
    <!-- Main wings -->
    <path
      d="M -16 2 L 0 -5 L 16 2 L 16 5 L 0 0 L -16 5 Z"
      fill="#FFFFFF"
    />
    <!-- Tail fin / horizontal stabilizer -->
    <path
      d="M -7 9 L 0 6 L 7 9 L 7 11 L 0 9 L -7 11 Z"
      fill="#FFFFFF"
    />
    <!-- Cockpit glass window -->
    <ellipse cx="0" cy="-12" rx="1" ry="2" fill="#0EA5E9" opacity="0.85" />
  </g>
</svg>
